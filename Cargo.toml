[package]
name = "WaifuDownloader"
version = "3.0.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = { version = "1.9", default-features = false, features = ["std", "backend-qt", "compat-1-2"] }
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
rfd = "0.15"
anyhow = "1"
getrandom = "0.3"
dirs = "6"

[build-dependencies]
slint-build = "1.9"
